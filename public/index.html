<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hookrelay</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪝</text></svg>"
    />
    <style>
      :root {
        --bg: #fafafa;
        --panel: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #7c3aed;
        --accent-soft: #ede9fe;
        --ok: #059669;
        --warn: #d97706;
        --err: #dc2626;
        --code-bg: #f3f4f6;
        --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b10;
          --panel: #13131a;
          --text: #e5e7eb;
          --muted: #9ca3af;
          --border: #262631;
          --accent: #a78bfa;
          --accent-soft: #2e1f5e;
          --code-bg: #1b1b24;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .pill::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .pill.on {
        color: var(--ok);
        border-color: var(--ok);
      }
      .pill.on::before {
        background: var(--ok);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent);
      }
      .url-bar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .url-bar code {
        flex: 1;
        min-width: 0;
        padding: 8px 12px;
        background: var(--code-bg);
        border-radius: 8px;
        font-family: var(--mono);
        overflow-x: auto;
        white-space: nowrap;
      }
      button {
        font: inherit;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      button.primary:hover {
        color: #fff;
        filter: brightness(1.1);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(260px, 360px) 1fr;
        height: calc(100vh - 118px);
      }
      @media (max-width: 760px) {
        .layout {
          grid-template-columns: 1fr;
          height: auto;
        }
      }
      .list {
        border-right: 1px solid var(--border);
        overflow-y: auto;
      }
      .item {
        display: grid;
        grid-template-columns: 64px 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .item:hover {
        background: var(--accent-soft);
      }
      .item[aria-selected='true'] {
        background: var(--accent-soft);
        box-shadow: inset 3px 0 var(--accent);
      }
      .method {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 12px;
      }
      .path {
        font-family: var(--mono);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .time {
        color: var(--muted);
        font-size: 12px;
      }
      .detail {
        overflow-y: auto;
        padding: 20px;
      }
      .detail h2 {
        margin: 0 0 4px;
        font-size: 16px;
        font-family: var(--mono);
        word-break: break-all;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 16px;
      }
      h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 20px 0 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--mono);
        font-size: 12px;
      }
      td {
        padding: 4px 8px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
        word-break: break-all;
      }
      td:first-child {
        color: var(--muted);
        width: 30%;
      }
      pre {
        margin: 0;
        padding: 12px;
        background: var(--code-bg);
        border-radius: 8px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12px;
      }
      .status-ok {
        color: var(--ok);
      }
      .status-warn {
        color: var(--warn);
      }
      .status-err {
        color: var(--err);
      }
      .empty {
        display: grid;
        place-items: center;
        height: 100%;
        color: var(--muted);
        text-align: center;
        padding: 40px;
      }
      .hero {
        max-width: 560px;
        margin: 10vh auto;
        padding: 0 20px;
        text-align: center;
      }
      .hero h2 {
        font-size: 28px;
        margin-bottom: 8px;
      }
      .hero p {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🪝 Hookrelay</h1>
      <span id="tunnel" class="pill" hidden>CLI tunnel offline</span>
    </header>
    <div id="app"></div>

    <script>
      const app = document.getElementById('app');
      const slug = location.pathname.startsWith('/e/') ? location.pathname.split('/')[2] : null;
      const token = new URLSearchParams(location.hash.slice(1)).get('token');
      const state = { requests: [], selected: null, tunnel: false, url: '' };

      const h = (tag, props = {}, ...children) => {
        const node = Object.assign(document.createElement(tag), props);
        node.append(...children.filter((c) => c != null));
        return node;
      };

      const api = (path, init = {}) =>
        fetch(path, { ...init, headers: { authorization: `Bearer ${token}`, ...init.headers } });

      if (!slug || !token) renderLanding();
      else boot();

      function renderLanding() {
        app.replaceChildren(
          h(
            'div',
            { className: 'hero' },
            h('h2', { textContent: 'Inspect and forward webhooks' }),
            h('p', {
              textContent:
                'Get a public URL, watch requests arrive live, and replay them to localhost with the CLI tunnel.',
            }),
            h('button', {
              className: 'primary',
              textContent: 'Create endpoint',
              onclick: async () => {
                const res = await fetch('/api/endpoints', { method: 'POST' });
                const { inspectUrl } = await res.json();
                location.href = inspectUrl;
              },
            }),
          ),
        );
      }

      async function boot() {
        const res = await api(`/api/endpoints/${slug}`);
        if (!res.ok) {
          app.replaceChildren(
            h(
              'div',
              { className: 'hero' },
              h('h2', { textContent: 'Endpoint not found' }),
              h('p', { textContent: 'It may have expired after 24h of inactivity.' }),
            ),
          );
          return;
        }
        const data = await res.json();
        Object.assign(state, {
          requests: data.requests,
          url: data.url,
          tunnel: data.tunnelConnected,
        });
        state.selected = state.requests[0]?.id ?? null;
        render();

        const events = new EventSource(
          `/api/endpoints/${slug}/events?token=${encodeURIComponent(token)}`,
        );
        events.addEventListener('request', (e) => {
          const req = JSON.parse(e.data);
          state.requests.unshift(req);
          state.selected ??= req.id;
          render();
        });
        events.addEventListener('update', (e) => {
          const req = JSON.parse(e.data);
          state.requests = state.requests.map((r) => (r.id === req.id ? req : r));
          render();
        });
        events.addEventListener('tunnel', (e) => {
          state.tunnel = JSON.parse(e.data).connected;
          renderTunnel();
        });
      }

      function renderTunnel() {
        const pill = document.getElementById('tunnel');
        pill.hidden = false;
        pill.className = `pill ${state.tunnel ? 'on' : ''}`;
        pill.textContent = state.tunnel ? 'CLI tunnel connected' : 'CLI tunnel offline';
        document.querySelectorAll('[data-replay]').forEach((b) => (b.disabled = !state.tunnel));
      }

      const statusClass = (s) =>
        s == null ? 'status-err' : s < 300 ? 'status-ok' : s < 500 ? 'status-warn' : 'status-err';

      function decodeBody(req) {
        const bytes = Uint8Array.from(atob(req.body), (c) => c.charCodeAt(0));
        const text = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
        if ((req.contentType ?? '').includes('json')) {
          try {
            return JSON.stringify(JSON.parse(text), null, 2);
          } catch {
            /* fall through */
          }
        }
        if ((req.contentType ?? '').includes('x-www-form-urlencoded')) {
          return [...new URLSearchParams(text)].map(([k, v]) => `${k} = ${v}`).join('\n');
        }
        return text || '(empty body)';
      }

      function render() {
        const curl = `curl -X POST ${state.url} -H 'content-type: application/json' -d '{"event":"test"}'`;
        const urlBar = h(
          'div',
          { className: 'url-bar' },
          h('code', { textContent: state.url }),
          h('button', { textContent: 'Copy URL', onclick: (e) => copy(state.url, e.target) }),
          h('button', { textContent: 'Copy curl', onclick: (e) => copy(curl, e.target) }),
          h('button', {
            textContent: 'Clear',
            onclick: async () => {
              await api(`/api/endpoints/${slug}/requests`, { method: 'DELETE' });
              state.requests = [];
              state.selected = null;
              render();
            },
          }),
        );

        const list = h(
          'nav',
          { className: 'list', ariaLabel: 'Captured requests' },
          ...state.requests.map((r) =>
            h(
              'div',
              {
                className: 'item',
                role: 'button',
                tabIndex: 0,
                ariaSelected: String(r.id === state.selected),
                onclick: () => {
                  state.selected = r.id;
                  render();
                },
                onkeydown: (e) => {
                  if (e.key === 'Enter') {
                    state.selected = r.id;
                    render();
                  }
                },
              },
              h('span', { className: 'method', textContent: r.method }),
              h('span', { className: 'path', textContent: r.path }),
              h('span', {
                className: 'time',
                textContent: new Date(r.receivedAt).toLocaleTimeString(),
              }),
            ),
          ),
        );

        const req = state.requests.find((r) => r.id === state.selected);
        const detail = h(
          'section',
          { className: 'detail' },
          ...(req
            ? renderDetail(req)
            : [
                h(
                  'div',
                  { className: 'empty' },
                  h(
                    'div',
                    {},
                    h('p', { textContent: 'Waiting for requests…' }),
                    h('pre', { textContent: curl }),
                    h('p', { textContent: 'Forward to localhost:' }),
                    h('pre', {
                      textContent: `hookrelay listen 3000 --server ${location.origin} --endpoint ${slug} --token ${token}`,
                    }),
                  ),
                ),
              ]),
        );

        app.replaceChildren(urlBar, h('div', { className: 'layout' }, list, detail));
        renderTunnel();
      }

      function renderDetail(req) {
        return [
          h('h2', { textContent: `${req.method} ${req.path}` }),
          h('div', {
            className: 'meta',
            textContent: `${new Date(req.receivedAt).toLocaleString()} · ${req.size} bytes · from ${req.ip}`,
          }),
          h('button', {
            className: 'primary',
            textContent: '↻ Replay to localhost',
            disabled: !state.tunnel,
            dataset: { replay: '' },
            onclick: async (e) => {
              e.target.disabled = true;
              await api(`/api/endpoints/${slug}/requests/${req.id}/replay`, { method: 'POST' });
              e.target.disabled = !state.tunnel;
            },
          }),
          req.forwards.length ? h('h3', { textContent: 'Deliveries' }) : null,
          req.forwards.length
            ? h(
                'table',
                {},
                ...req.forwards.map((f) =>
                  h(
                    'tr',
                    {},
                    h('td', { textContent: new Date(f.at).toLocaleTimeString() }),
                    h('td', {
                      className: statusClass(f.status),
                      textContent: f.error ?? `${f.status} in ${f.durationMs}ms`,
                    }),
                  ),
                ),
              )
            : null,
          h('h3', { textContent: 'Headers' }),
          h(
            'table',
            {},
            ...Object.entries(req.headers).map(([k, v]) =>
              h('tr', {}, h('td', { textContent: k }), h('td', { textContent: v })),
            ),
          ),
          h('h3', { textContent: 'Body' }),
          h('pre', { textContent: decodeBody(req) }),
        ];
      }

      async function copy(text, button) {
        await navigator.clipboard.writeText(text);
        const label = button.textContent;
        button.textContent = 'Copied ✓';
        setTimeout(() => (button.textContent = label), 1200);
      }
    </script>
  </body>
</html>
